spring.application.name=Seia

spring.datasource.url=jdbc:postgresql://localhost:5432/seia
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.max-output-tokens=16000
spring.ai.google.genai.chat.options.response-mime-type=application/json
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
api.security.token.secret=${TOKEN_SECRET}
